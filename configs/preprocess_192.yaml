# Settings that build the 192^3 voxel cache (preprocess step).
#
# sparseshower/data.py is the same preprocessing code as the earlier
# corsika_sparse_v1 package, and data / macro below are the same values, so a
# rebuild gives the same event files, the same signature.json and, with the
# same seed, the same train / val / test split as the v1 cache.
# scripts/check_cache.py compares a cache with this file.
#
# A finished cache is read only: preprocess refuses to write into it.  To build
# a new cache, set paths.processed below to a new directory; to train on it,
# set paths.processed in data.yaml to the same directory.
extends: data.yaml

seed: 20260922                 # split seed of the cache; only the split uses it here

paths:
  raw: /data/user/qwang/z0918_cherenkov
  processed: /data/user/qwang/corsika_sparse_v2/data/processed_192
