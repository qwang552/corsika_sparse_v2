# Model settings: FieldAE -> LatentDiT -> struct -> attr.
# One file for all four because sampling and evaluation need them together.
# Each kind fingerprints only the sections it depends on (loader.KIND_SECTIONS:
# data, field, train and ae for every kind; edm for dit and attr; model for
# struct and attr; encode for dit), so editing `dit` never blocks resuming `attr`.
extends: data.yaml

ae:
  widths: [64, 128, 256]        # 48^3, 24^3, 12^3
  blocks: 2                     # ResBlocks per resolution
  latent_channels: 8            # latent = 8 x 12^3
  attn_heads: 4                 # self-attention at 12^3; 0 disables
  kl_beta: 1.0e-6
  pos_weight: 4.0               # occupied 48^3 cells are ~5% of the grid (audit median 5,940 / 110,592)
  photon_alpha: 0.25            # extra BCE weight 1 + alpha*log1p(photons) on occupied cells
  w_ch0: 1.0
  w_ch1: 1.0
  w_profile: 0.1                # longitudinal + radial photon-profile L1 and log total
  batch_size: 4
  accum: 2                      # effective batch 8
  steps: 30000
  lr: 0.0002
  ema: 0.999
  probe_events: 16

encode:
  d4: false                     # D4 data augmentation off; true = also write the 8 rotated / mirrored train latents
  batch_size: 8

dit:
  patch: 2                      # 12^3 latent -> 6^3 = 216 tokens
  width: 384
  depth: 12
  heads: 6
  mlp_ratio: 4
  batch_size: 32
  accum: 1
  steps: 100000
  lr: 0.0001
  ema: 0.9999
  d4: false                     # D4 data augmentation off; true = train on the D4 latents (needs encode.d4: true)
  probe_events: 64

struct:
  g_dim: 128
  shape_radius: 2
  colours: 8                    # 2x2x2 parity colouring: no two same-colour parents touch (26-connectivity)
  recon_parent_p: 0.75          # level 48->96: parents = decoded {p_occ > occ_threshold} with this probability
  posterior_p: 0.5              # decode z = mu + sigma*eps (else mu)
  aug_p: 0.5                    # corrupted parent set (drop/add) on truth parent sets
  drop_frac: 0.08
  add_frac: 0.08
  cut_p: 0.3                    # track-cut augmentation probability
  cut_frac: 0.05                # up to this fraction of known parents erased along tracks
  cut_len: [1, 3]
  label_smoothing: 0.0
  child_prior: 0.35             # initial output bias: each child active with this probability
  config0_prior: 0.02           # initial probability of configuration 0 (no active child)
  temperature: 1.0
  steps: 40000
  probe_events: 2

attr:
  g_dim: 128
  photon_alpha: 0.5
  drop_p: 0.5                   # structure dropout probability
  drop_frac: 0.05               # up to 5% of voxels removed (targets of the rest unchanged)
  posterior_p: 0.5
  steps: 60000
  probe_events: 2
  probe_sigmas: [0.01, 0.03, 0.1, 0.3, 1.0]

# Acceptance thresholds used in passfail.md.  Working targets, not physics requirements.
# ratio = W1(generated, truth half A) / W1(truth half B, truth half A), B subsampled to the generated size.
thresholds:
  ae:
    lost_photon_frac: 0.005
    n48_rel_err: 0.02
    field_long_l1: 0.01
    field_rad_l1: 0.02
    q_total_rel_err: 0.01
  paired:                       # sa_truth, sa_recon
    q_total_rel_err: 0.02
    long_l1: 0.03               # sa_recon only
  distribution:                 # every chain
    w1_ratio: 2.0
    c2st_auc: 0.65
  memorization_ratio: 0.9
